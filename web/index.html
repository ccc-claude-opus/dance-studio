<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>真人動捕舞蹈教室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: rehearsal studio. Stage canvas on top (left on desktop), control desk below (right on desktop). Single dark theme by choice: a lit stage reads best on dark. */
:root{
  --ink:#ece6da;--ink-dim:#a59d8f;--ink-faint:#776f63;
  --hall:#14120f;--desk:#1d1a16;--desk-2:#27231d;--line:#3a342b;
  --brass:#d9a648;--brass-ink:#1a1406;--lead:#7f93c9;--follow:#d2566b;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--hall);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hall)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);max-width:1320px;margin:0 auto}
@media (min-width:900px){.wrap{grid-template-columns:minmax(0,1fr) 420px;min-height:100%}}
.stage{position:relative;height:min(58vh,620px);min-height:330px;background:#0b0a09;overflow:hidden}
@media (min-width:900px){.stage{height:100vh;position:sticky;top:0}}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:12px;right:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.hud .now{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,5vw,32px);letter-spacing:.02em;text-shadow:0 2px 12px #000a;line-height:1.2}
.hud .fig{font-size:14px;margin-top:4px;color:var(--ink);text-shadow:0 1px 8px #000}
.hud .fig em{font-style:normal;color:var(--brass);font-family:var(--f-mono);font-size:12px;margin-left:6px}
.badge{align-self:flex-start;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--brass);border:1px solid #d9a64866;padding:3px 8px;border-radius:3px;white-space:nowrap;background:#0008}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-dim);font-size:13px;pointer-events:none;background:#0b0a0999}
.cam{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;gap:6px}
.cam button,.musicbtn{background:#000a;color:var(--ink);border:1px solid var(--line);border-radius:6px;font:500 12px var(--f-body);padding:6px 10px;cursor:pointer}
.cam button:hover{border-color:var(--brass)}
.musicbtn{position:absolute;left:calc(max(12px,env(safe-area-inset-left,0px)) + 46px);bottom:12px;font-size:13px;padding:7px 12px}
.stageplay{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;width:38px;height:34px;border-radius:6px;border:1px solid var(--line);background:#000a;color:var(--ink);font-size:14px;cursor:pointer;display:grid;place-items:center;z-index:3}
.stageplay:hover{border-color:var(--brass);color:var(--brass)}
.musicbtn[aria-pressed=true]{border-color:var(--brass);color:var(--brass)}
.desk{background:var(--desk);padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
.dances{display:flex;flex-wrap:wrap;gap:6px}
.dances .grp{flex-basis:100%;margin-top:6px}
.dances .grp:first-child{margin-top:0}
.dance{background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--ink-dim);font:500 14px var(--f-body);padding:6px 13px;cursor:pointer}
.dance[aria-pressed=true]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.transport{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px}
.play{width:46px;height:46px;border-radius:50%;border:none;background:var(--brass);color:var(--brass-ink);font-size:18px;cursor:pointer;display:grid;place-items:center}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.time{font-family:var(--f-mono);font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--brass)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.label{font-size:11px;letter-spacing:.14em;color:var(--ink-faint);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:none;color:var(--ink-dim);font:500 14px var(--f-body);padding:7px 13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--desk-2);color:var(--ink)}
.seg button:disabled{color:var(--ink-faint);cursor:not-allowed}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.note{font-size:12.5px;color:var(--ink-dim)}
.slider{display:grid;grid-template-columns:3.2em minmax(0,1fr) 3.4em;gap:10px;align-items:center}
.slider output{font-family:var(--f-mono);font-size:13px;text-align:right}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-dim);cursor:pointer}
.toggle input{accent-color:var(--brass);width:16px;height:16px}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2.sec small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--ink-faint)}
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.figbtn{background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-align:left;padding:9px 11px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:1px;min-width:0}
.figbtn:hover{border-color:#5a5043}
.figbtn[aria-pressed=true]{border-color:var(--brass);background:#d9a64814}
.figbtn b{font-weight:500;font-size:14px}
.figbtn i{font-style:normal;font-size:11.5px;color:var(--ink-dim)}
.figbtn span{font-size:11px;color:var(--ink-faint);font-family:var(--f-mono)}
.figbtn.free{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.figbtn.free b{font-family:var(--f-display);font-weight:600;font-size:15px}
.desc{font-size:13px;color:var(--ink-dim);border-left:2px solid var(--brass);padding-left:10px;min-height:1.4em}
.music{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px}
.songs{display:flex;flex-direction:column;gap:4px}
.song{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;background:transparent;color:var(--ink);font:inherit;text-align:left}
.song[aria-pressed=true]{border-color:var(--brass);background:#d9a64814}
.song .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.song .bpm{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-dim);white-space:nowrap}
.songs .grp{font-size:12px;color:var(--ink-dim);margin:6px 2px 0}
.song .x{background:none;border:none;color:var(--ink-faint);font-size:16px;cursor:pointer;padding:0 4px}
.btn{background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--ink);font:500 13px var(--f-body);padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--brass)}
.bpmrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-dim)}
.bpmrow b{font-family:var(--f-mono);color:var(--ink);font-weight:500;min-width:4ch;text-align:center}
.gen{color:var(--follow)}
.vids{display:flex;flex-direction:column;gap:6px}
.vcats{display:flex;flex-wrap:wrap;gap:5px}
.vcat{background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--ink-dim);font:500 12.5px var(--f-body);padding:4px 10px;cursor:pointer}
.vcat[aria-pressed=true]{border-color:var(--brass);color:var(--brass)}
.vlink{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);text-decoration:none}
.vlink:hover{border-color:var(--brass)}
.vlink .pl{width:28px;height:20px;border-radius:5px;background:#c4302b;display:grid;place-items:center;color:#fff;font-size:10px}
.vlink .t{font-size:14px;line-height:1.35}
.vlink .lg{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-faint)}
.pip{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:52px;width:min(44%,360px);border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#000;z-index:3}
.pip video{display:block;width:100%;max-height:46vh;background:#000}
.pip .bar{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 6px;background:#000c;font-size:11px;color:var(--ink-dim)}
.pip .bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pip button{background:none;border:none;color:var(--ink);font-size:15px;cursor:pointer;padding:0 4px}
.beats{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:4px;align-items:flex-end;pointer-events:none;z-index:2}
.beats span{font-family:var(--f-mono);font-size:15px;color:#ece6da66;min-width:1.15em;text-align:center;transition:color .08s,transform .08s;line-height:1}
.beats span.on{color:var(--brass);transform:scale(1.9);text-shadow:0 0 12px #000}
.beats span.one{color:#ece6daaa}
.beats span.one.on{color:#ffd27a}
@media (max-width:520px){.beats{left:auto;right:max(12px,env(safe-area-inset-right,0px));transform:none}}
.cap canvas{display:block;max-width:100%;border-radius:8px;background:#000}
.prog{height:6px;border-radius:3px;background:var(--desk-2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--brass);transition:width .15s}
.cap input[type=text],.cap input[type=number]{background:var(--desk-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:inherit;padding:7px 10px;min-width:0}
.cap input[type=number]{width:5.5em}
.cap .err{color:#ff8a8a;font-size:13px}
.cam-rec{color:#ff6b6b;font-family:var(--f-mono);font-size:12.5px}
.btn.rec{border-color:#ff6b6b;color:#ff6b6b}
.btn:disabled{opacity:.45;cursor:default}
.camplay{display:flex;gap:8px;align-items:center;margin-top:8px}
.camplay input[type=range]{flex:1;min-width:0}
.camplay .time{font-family:var(--f-mono);font-size:12px;color:var(--ink-dim);white-space:nowrap}
.recs{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.recs .song .where{font-size:11px;color:var(--ink-faint);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}
.recs .song{grid-template-columns:minmax(0,1fr) auto auto auto}
.figbtn .mine{color:var(--brass)}
.foot{font-size:12px;color:var(--ink-faint);border-top:1px solid var(--line);padding-top:14px;line-height:1.7}
.foot a{color:var(--ink-dim)}
</style>

<div class="wrap">
  <section class="stage" aria-label="舞台" data-i18n-aria="stage">
    <canvas id="gl"></canvas>
    <div class="hud">
      <div>
        <div class="now" id="nowName">薩爾薩</div>
        <div class="fig" id="nowFig"></div>
      </div>
      <div class="badge" id="nowBadge">MOCAP</div>
    </div>
    <div class="pip" id="pip" hidden><video id="pipVideo" playsinline controls></video><div class="bar"><span id="pipName"></span><button id="pipClose" aria-label="關閉影片" data-i18n-aria="closeVideo">×</button></div></div>
    <div class="loading" id="loading" data-i18n="loadingDancers">載入舞者…</div>
    <button class="stageplay" id="stagePlay" aria-label="暫停">❚❚</button>
    <button class="musicbtn" id="musicBtn" aria-pressed="false">♪ 開啟音樂</button>
    <div class="beats" id="beats" aria-hidden="true"></div>

  </section>

  <section class="desk">
    <div class="row" style="justify-content:space-between">
      <span class="label" data-i18n="language">語言</span>
      <div class="seg" role="group" aria-label="Language">
        <button id="langZh" lang="zh-Hant" aria-pressed="true">中文</button>
        <button id="langEn" lang="en" aria-pressed="false">English</button>
      </div>
    </div>
    <div class="dances" id="dances" role="group" aria-label="舞種" data-i18n-aria="dances"></div>

    <div class="transport">
      <button class="play" id="play" aria-label="暫停">❚❚</button>
      <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="播放位置" data-i18n-aria="position">
      <span class="time" id="time">0.0 / 0.0 s</span>
    </div>

    <div class="row" style="justify-content:space-between">
      <div class="row">
        <span class="label" data-i18n="demo">示範</span>
        <div class="seg" role="group" aria-label="示範人數" data-i18n-aria="demoCount">
          <button id="mSolo" aria-pressed="false" data-i18n="solo">單人</button>
          <button id="mDuo" aria-pressed="true" data-i18n="duo">雙人</button>
        </div>
      </div>
      <div class="row" id="roleRow">
        <span class="label" data-i18n="role">角色</span>
        <div class="seg" role="group" aria-label="角色" data-i18n-aria="role">
          <button id="rLead" aria-pressed="true"><span class="dot" style="background:var(--lead)"></span><span data-i18n="leadPart">男步</span></button>
          <button id="rFollow" aria-pressed="false"><span class="dot" style="background:var(--follow)"></span><span data-i18n="followPart">女步</span></button>
        </div>
      </div>
    </div>
    <div class="row">
      <span class="label" data-i18n="figure">人物</span>
      <div class="seg" role="group" aria-label="人物" data-i18n-aria="figure">
        <button id="chMan" aria-pressed="true" data-i18n="chMannequin">人偶</button><button id="chReal" aria-pressed="false" data-i18n="chReal">擬真人物</button>
      </div>
    </div>
    <div class="row" id="outfitRow">
      <span class="label" data-i18n="outfit">女生服裝</span>
      <div class="seg" role="group" aria-label="女生服裝" data-i18n-aria="outfit">
        <button id="outPants" aria-pressed="true" data-i18n="outPants">喇叭褲</button><button id="outSkirt" aria-pressed="false" data-i18n="outSkirt">裙子</button>
      </div>
    </div>
    <div class="row" id="focusRow">
      <span class="label" data-i18n="focus">焦點</span>
      <div class="seg" role="group" aria-label="焦點" data-i18n-aria="focus">
        <button id="fBoth" aria-pressed="true" data-i18n="focusBoth">兩人</button>
        <button id="fLead" aria-pressed="false"><span class="dot" style="background:var(--lead)"></span><span data-i18n="focusLead">男生</span></button>
        <button id="fFollow" aria-pressed="false"><span class="dot" style="background:var(--follow)"></span><span data-i18n="focusFollow">女生</span></button>
      </div>
    </div>
    <div class="note" id="note"></div>

    <div class="slider">
      <span class="label" data-i18n="speed">速度</span>
      <input type="range" id="speed" min="0.25" max="1.5" step="0.05" value="1" aria-label="播放速度" data-i18n-aria="speedAria">
      <output id="speedOut">1.00×</output>
    </div>
    <div class="row">
      <span class="label" data-i18n="view">視角</span>
      <div class="seg" role="group" aria-label="視角" data-i18n-aria="view" style="flex-wrap:wrap">
        <button id="camFront" data-i18n="front">正面</button><button id="camBack" data-i18n="back">背後</button><button id="camSide" data-i18n="side">側面</button><button id="camTop" data-i18n="top">俯視</button><button id="camFeet" data-i18n="feet">看腳</button>
      </div>
    </div>
    <div class="row">
      <span class="label" data-i18n="playMode">播放</span>
      <div class="seg" role="group" aria-label="播放" data-i18n-aria="playMode">
        <button id="pmCont" aria-pressed="true" data-i18n="cont">連續</button><button id="pmStep" aria-pressed="false" data-i18n="stepMode">一步一停</button>
      </div>
      <button class="btn" id="slowLoop" aria-pressed="false" data-i18n="slowLoop">0.5× 慢速循環</button>
    </div>
    <div class="row">
      <label class="toggle"><input type="checkbox" id="showFeet" checked> <span data-i18n="footprints">地板腳印</span></label>
      <label class="toggle"><input type="checkbox" id="showBeats" checked> <span data-i18n="beatsShow">大字拍數</span></label>
      <label class="toggle"><input type="checkbox" id="clickSound"> <span data-i18n="clickSound">拍子提示音</span></label>
    </div>
    <div class="note" id="practiceNote"></div>
    <div class="music">
      <h2 class="sec"><span data-i18n="music">音樂</span> <small id="musicState"></small></h2>
      <div class="songs" id="songs"></div>
      <div class="row">
        <button class="btn" id="addSong" data-i18n="addSong">＋ 加入我的歌曲</button>
        <input type="file" id="songFile" accept="audio/*" multiple hidden>
      </div>
      <div id="songCtl" hidden>
        <div class="bpmrow"><span data-i18n="songTempo">歌曲速度</span>
          <button class="btn" id="bpmDown" aria-label="BPM −1">−</button><b id="bpmVal">120</b><button class="btn" id="bpmUp" aria-label="BPM +1">＋</button>
          <button class="btn" id="tap" data-i18n="tap">跟著拍子點我</button>
        </div>
        <label class="toggle" style="margin-top:8px"><input type="checkbox" id="sync" checked> <span data-i18n="sync">舞步配合歌曲節拍（自動調整舞速）</span></label>
      </div>
      <div class="slider">
        <span class="label" data-i18n="volume">音量</span>
        <input type="range" id="vol" min="0" max="1" step="0.05" value="0.7" aria-label="音樂音量" data-i18n-aria="volume">
        <output id="volOut">70%</output>
      </div>
      <div class="note" id="musicNote"></div>
    </div>
    <div class="row">
      <label class="toggle"><input type="checkbox" id="mirror"> <span data-i18n="mirror">鏡像（像照鏡子跟著跳）</span></label>
      <label class="toggle"><input type="checkbox" id="seeThrough" checked> <span data-i18n="seeThrough">腳半透明（看得到被擋住的腳步）</span></label>
      <label class="toggle"><input type="checkbox" id="follow" checked> <span data-i18n="camFollow">鏡頭跟隨</span></label>
    </div>

    <div class="music">
      <h2 class="sec"><span data-i18n="videos">真人影片</span> <small>YouTube</small></h2>
      <div class="vcats" id="vcats" role="group"></div>
      <div class="vids" id="vids"></div>
      <div class="note" data-i18n="vidNote"></div>
      <div class="row">
        <button class="btn" id="addVideo" data-i18n="addVideo">＋ 播放我手機裡的影片</button>
        <input type="file" id="videoFile" accept="video/*" hidden>
      </div>
    </div>

    <div class="music cap" id="capBox">
      <h2 class="sec"><span data-i18n="capTitle">從影片抓動作</span> <small data-i18n="capBeta">實驗功能</small></h2>
      <div class="note" data-i18n="capIntro"></div>
      <div class="row"><button class="btn" id="capPick" data-i18n="capPick">選擇舞蹈影片</button><input type="file" id="capFile" accept="video/*" hidden><span class="note" id="capFileName"></span></div>
      <div id="capOpts" hidden>
        <div class="row">
          <span class="label" data-i18n="capPeople">人數</span>
          <div class="seg" role="group"><button id="capP1" aria-pressed="true" data-i18n="solo">單人</button><button id="capP2" aria-pressed="false" data-i18n="duo">雙人</button></div>
        </div>
        <div class="row" style="margin-top:8px">

    for(let i=0;i<F;i++){const o=i*n;let v=0;if(i>0){const p=(i-1)*n;v=Math.hypot(f[o+an*3]-f[p+an*3],f[o+an*3+2]-f[p+an*3+2])*fps;}

/* Generated partner: the follow mirrors the lead across the lead's frontal plane (closed-position opposition:
   lead steps forward with the left, follow steps back with the right), stands D metres in front, slightly smaller. */
function makePartner(f,F,D){
  const NJ=window.JOINTS.length,n=NJ*3,out=new Float32Array(f.length);
  const ang=new Float32Array(F);let prev=0;
  for(let i=0;i<F;i++){const o=i*n;const sx=f[o+J.lSh*3]-f[o+J.rSh*3],sz=f[o+J.lSh*3+2]-f[o+J.rSh*3+2];
    let a=Math.atan2(sx,-sz);if(i){while(a-prev>Math.PI)a-=2*Math.PI;while(a-prev<-Math.PI)a+=2*Math.PI;}ang[i]=prev=a;}
  const W=12,sm=new Float32Array(F);
  for(let i=0;i<F;i++){let s=0,c=0;for(let k=Math.max(0,i-W);k<=Math.min(F-1,i+W);k++){s+=ang[k];c++;}sm[i]=s/c;}
  const swap=window.JOINTS.map(nm=>{const m=nm[0]==='l'&&nm[1]===nm[1].toUpperCase()?'r'+nm.slice(1):nm[0]==='r'&&nm[1]===nm[1].toUpperCase()?'l'+nm.slice(1):nm;return J[m]??J[nm];});
  const SC=0.94;
  for(let i=0;i<F;i++){const o=i*n;const fx=Math.cos(sm[i]),fz=Math.sin(sm[i]);const rx=f[o],rz=f[o+2];
    for(let j=0;j<NJ;j++){const x=f[o+j*3]-rx,y=f[o+j*3+1],z=f[o+j*3+2]-rz;const d=x*fx+z*fz;
      const mx=(x-2*d*fx)*SC,mz=(z-2*d*fz)*SC;const t=o+swap[j]*3;
      out[t]=rx+D*fx+mx;out[t+1]=y*SC;out[t+2]=rz+D*fz+mz;}}
  return out;
}
let samba=null,sambaLoading=null;
function loadSamba(){

    const go=()=>{const bin=atob(window.MICHELLE_B64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      new GLTFLoader().parse(u.buffer,'',gltf=>{
        const root=gltf.scene;root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
        const mixer=new THREE.AnimationMixer(root);const clip=gltf.animations.find(a=>/samba/i.test(a.name))||gltf.animations[0];
        const action=mixer.clipAction(clip);action.play();mixer.update(0);
        let hipBone=null;root.traverse(o=>{if(o.isBone&&!hipBone&&/hips/i.test(o.name))hipBone=o;});
        root.updateMatrixWorld(true);const hy=hipBone?hipBone.getWorldPosition(new THREE.Vector3()).y:0;
        if(hy>0.01)root.scale.multiplyScalar(0.95/hy);
        samba={root,mixer,action,dur:clip.duration,hipBone};res(samba);
      },rej);};
    loadFile('michelle.js').then(go,rej);

const frameBuf=new Float32Array(window.JOINTS.length*3);const centroid=V();
function applyFrame(){
  if(!S.clip)return;centroid.set(0,0,0);
  if(S.clipKey==='samba'){
    if(samba){samba.action.time=S.t%samba.dur;samba.mixer.update(0);if(samba.hipBone){samba.hipBone.getWorldPosition(centroid);centroid.y=S.camY||0.95;}}
  } else {
    const c=S.clip;const fpos=Math.min(Math.max(S.t*c.fps,0),c.frames-1.001);const i0=Math.floor(fpos),k=fpos-i0,i1=Math.min(i0+1,c.frames-1);
    const n=window.JOINTS.length*3;
    for(const d of S.dancers){const f=c.actors[d.idx].f;
      for(let j=0;j<n;j++)frameBuf[j]=f[i0*n+j]*(1-k)+f[i1*n+j]*k;
      poseDancer(d,frameBuf);if(d.char&&!d.ghost)retarget(d,frameBuf);d.hx=frameBuf[0];d.hz=frameBuf[2];
      d.fx=-(frameBuf[J.lSh*3+2]-frameBuf[J.rSh*3+2]);d.fz=frameBuf[J.lSh*3]-frameBuf[J.rSh*3];}
    const foc=focusDancer();const cs=foc?[foc]:S.dancers;
    for(const d of cs){centroid.x+=d.hx;centroid.z+=d.hz;}
    centroid.multiplyScalar(1/Math.max(1,cs.length));centroid.y=S.camY||0.95;
  }
  if(S.mirror)centroid.x*=-1;
  const span=S.b-S.a,rel=S.t-S.a;

}

function facing(){

  const foc=focusDancer()||S.dancers[0];
  const fw=new THREE.Vector3(foc.fx,0,foc.fz).normalize();if(S.mirror)fw.x*=-1;
  if(S.dancers.length>1&&!focusDancer()){const a=S.dancers[0],b=S.dancers[1];let dx=b.hx-a.hx,dz=b.hz-a.hz;if(S.mirror)dx=-dx;const L=Math.hypot(dx,dz)||1;fw.set(-dz/L,0,dx/L);}
  return fw.lengthSq()>0.5?fw:new THREE.Vector3(0,0,1);

function snapCam(kind){

  const fw=facing();const duo=S.dancers.length>1;

  else if(kind==='feet'){if(duo){const A_=S.dancers[0],B_=S.dancers[1];let dx=B_.hx-A_.hx,dz=B_.hz-A_.hz;if(S.mirror)dx=-dx;const L=Math.hypot(dx,dz)||1;dir=new THREE.Vector3(-dz/L,0,dx/L);}else dir=own.clone();dir.y=0.2;dist=duo?3.0:2.5;}
  else{dir=fw.clone();dir.y=0.22;}
  dir.normalize();camera.position.copy(controls.target).addScaledVector(dir,dist);controls.update();
}

  },
  tracks(){const L=window.MUSIC_TRACKS[DANCES[S.dance]?.style]||[];

  sync(){

    else a.pause();

    else if(el.disabled){el.disabled=false;$('speedOut').textContent=S.speed.toFixed(2)+'×';}}
};

async function detectBPM(buf){
  const ctx=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,44100,44100);
  const ab=await new Promise((res,rej)=>{const p=ctx.decodeAudioData(buf,res,rej);if(p&&p.then)p.then(res,rej);});
  const sr=ab.sampleRate,ch=ab.getChannelData(0),hop=512,start=Math.min(Math.floor(ab.duration*0.15),20)*sr,end=Math.min(ch.length,start+60*sr);
  const env=[];let prev=0;
  for(let i=start;i+hop<end;i+=hop){let e=0;for(let k=0;k<hop;k++){const v=ch[i+k];e+=v*v;}const l=Math.log(1e-9+e);env.push(Math.max(0,l-prev));prev=l;}
  const fr=sr/hop;let best=120,bv=-1;
  for(let bpm=70;bpm<=180;bpm+=0.5){const lag=60/bpm*fr;const L=Math.floor(lag),w=lag-L;let s=0;
    for(let i=0;i+L+1<env.length;i++)s+=env[i]*(env[i+L]*(1-w)+env[i+L+1]*w);
    s/=env.length-L;const pr=Math.exp(-Math.pow(Math.log2(bpm/120),2)/(2*0.5*0.5));
    if(s*pr>bv){bv=s*pr;best=bpm;}}
  return Math.round(best);
}

const COUNTS={waltz:3,vwaltz:3,ballet:3,jive:6};
const beatLen=()=>{const m=META[S.clipKey];return m?60/m.bpm:0.5;};
const beatsPerBar=()=>COUNTS[DANCES[S.dance]?.style]||8;
function countAt(t){const m=META[S.clipKey];if(!m)return null;const x=(t-m.off)/beatLen();const nb=beatsPerBar();
  const i=Math.floor(x+1e-6);return {i,n:((i%nb)+nb)%nb+1,frac:x-i};}
const fpGroup=new THREE.Group();world.add(fpGroup);
const soleShape=(()=>{const sh=new THREE.Shape();sh.moveTo(-0.11,0);sh.bezierCurveTo(-0.115,0.035,-0.06,0.04,-0.02,0.036);
  sh.bezierCurveTo(0.05,0.05,0.12,0.045,0.125,0.0);sh.bezierCurveTo(0.12,-0.04,0.05,-0.035,0.0,-0.032);sh.bezierCurveTo(-0.06,-0.03,-0.115,-0.035,-0.11,0);return sh;})();
const soleGeo=new THREE.ShapeGeometry(soleShape,12);
const FPCOL={lead:0x7f93c9,follow:0xe0607a,solo:0xd9a648};
const labelTex={};
function numTex(txt,col){const k=txt+col;if(labelTex[k])return labelTex[k];const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  g.fillStyle='#'+col.toString(16).padStart(6,'0');g.beginPath();g.arc(32,32,28,0,7);g.fill();g.fillStyle='#14120f';g.font='bold 34px JetBrains Mono, monospace';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,32,34);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return labelTex[k]=t;}
const fpPool=[];
function fpItem(i){
  if(fpPool[i])return fpPool[i];
  const g=new THREE.Group();const m=new THREE.Mesh(soleGeo,new THREE.MeshBasicMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide}));
  m.rotation.x=-Math.PI/2;m.position.y=0.004;g.add(m);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({transparent:true,depthWrite:false,depthTest:false}));sp.scale.set(0.11,0.11,1);g.add(sp);
  fpGroup.add(g);return fpPool[i]={g,m,sp};
}
function updateFootprints(){
  let used=0;
  if($('showFeet').checked&&S.clip&&S.clipKey!=='samba'){
    const look=Math.max(1.6,beatLen()*4)*1;const foc=focusDancer();
    for(const d of S.dancers){
      if(foc&&d!==foc)continue;const a=S.clip.actors[d.idx];if(!a.plants)continue;
      const col=FPCOL[a.role]||FPCOL.solo;let shown=0;
      for(const p of a.plants){
        if(p.te<S.t-0.25||p.t>S.t+look)continue;if(shown>=5)break;shown++;
        const it=fpItem(used++);it.g.visible=true;
        it.g.position.set(p.x,0,p.z);it.g.rotation.y=-p.ang;
        it.m.scale.set(1,p.side==='l'?1:-1,1);
        const now=S.t>=p.t-0.02&&S.t<=p.te;const fut=p.t>S.t;
        const op=now?0.95:fut?Math.max(0.22,0.8-(p.t-S.t)/look*0.6):Math.max(0,0.5-(S.t-p.te)*2);
        it.m.material.color.setHex(col);it.m.material.opacity=op;
        const c=countAt(p.t);const lbl=c?(c.frac>0.3&&c.frac<0.7?'&':String(c.frac>=0.7?((c.n)%beatsPerBar())+1:c.n)):'';
        it.sp.material.map=numTex(lbl,col);it.sp.material.opacity=Math.min(1,op+0.1);it.sp.material.needsUpdate=true;
        it.sp.position.set(-0.17,0.05,0);it.sp.visible=op>0.15;
        if(S.mirror)it.sp.scale.set(-0.11,0.11,1);else it.sp.scale.set(0.11,0.11,1);
      }
    }
  }
  for(let i=used;i<fpPool.length;i++)fpPool[i].g.visible=false;
}

    $('capFileName').textContent=`${f.name} · ${T('capDur',{s:d.toFixed(1)})}`;URL.revokeObjectURL(v.src);};
  v.onerror=()=>capErr(T('capVideoErr'));};
const setPeople=n=>{cap.people=n;$('capP1').setAttribute('aria-pressed',String(n===1));$('capP2').setAttribute('aria-pressed',String(n===2));};
$('capP1').onclick=()=>setPeople(1);$('capP2').onclick=()=>setPeople(2);
$('capRun').onclick=async()=>{
  if(!cap.file)return;capReset();removeTemp();$('capWork').hidden=false;$('capRun').hidden=true;$('capStop').hidden=false;
  const ac=new AbortController();cap.abort=ac;$('capStatus').textContent=T('capLoading');$('capBar').style.width='0%';
  try{
    const mod=await import(new URL('capture.js',document.baseURI).href);
    const st=Math.max(0,+$('capStart').value||0),en=Math.max(st+1,+$('capEnd').value||st+10);
    cap.res=await mod.captureVideo(cap.file,{numPoses:cap.people,start:st,end:en,overlay:$('capCanvas'),signal:ac.signal,
      onProgress:(p,ph)=>{if(ph==='run'){$('capBar').style.width=Math.round(p*100)+'%';$('capStatus').textContent=T('capRunning',{p:Math.round(p*100)});}}});
    cap.swap=false;cap.count++;showCapDone();
  }catch(err){
    if(String(err.message)!=='aborted')capErr(err.message==='nobody'?T('capNobody'):err.message==='video'?T('capVideoErr'):T('capFail',{m:err.message||err}));
    $('capWork').hidden=true;
  }finally{$('capRun').hidden=false;$('capStop').hidden=true;cap.abort=null;}
};
$('capStop').onclick=()=>{if(cap.abort)cap.abort.abort();};
function capRolesText(){if(!cap.res||cap.res.actors.length<2)return'';return T('capRoles',{r:cap.swap?T('whoFollow'):T('whoLead')});}
function showCapDone(){
  $('capDone').hidden=false;const r=cap.res;
  $('capSummary').textContent=T('capSummary',{n:r.actors.length,s:r.duration.toFixed(1)});
  $('capSwapRow').hidden=r.actors.length<2;$('capRoles').textContent=capRolesText();
  $('capName').value=T('capDefaultName',{n:cap.count});$('capName').placeholder=T('capDefaultName',{n:cap.count});
  $('capAdd').textContent=T('capAddTo',{d:DN(DANCES[S.dance])});
  previewCapture();
}
$('capSwap').onclick=()=>{cap.swap=!cap.swap;$('capRoles').textContent=capRolesText();previewCapture();};
function capActors(){const r=cap.res;const roles=r.actors.length>1?(cap.swap?['follow','lead']:['lead','follow']):['solo'];
  return r.actors.map((a,i)=>({role:roles[i],f:a.f}));}
function registerMove(key,name,dance,actors,frames,fps,opts={}){
  const bpm=(()=>{const ks=DANCES[dance].takes.map(t=>META[t.clip]?.bpm).filter(Boolean).sort((a,b)=>a-b);return ks.length?ks[ks.length>>1]:100;})();
  META[key]={fps,frames,bpm,off:0,pair:actors.length>1};
  const c={...META[key],actors:actors.map(a=>({role:a.role,f:a.f}))};for(const a of c.actors)a.plants=detectPlants(a.f,frames,fps);decoded[key]=c;
  const fig={name,en:name,desc:'',den:'',clip:key,a:0,b:(frames-1)/fps,user:true,temp:!!opts.temp,id:opts.id};
  DANCES[dance].figs.push(fig);
  if(opts.free)DANCES[dance].takes.push({clip:key,name,name_en:name,user:true});
  return DANCES[dance].figs.length-1;
}
function removeTemp(){for(const id in DANCES){const d=DANCES[id];const i=d.figs.findIndex(f=>f.temp);if(i>=0){d.figs.splice(i,1);if(S.dance===id){if(S.fig===i)selectFree();else{if(S.fig!==null&&S.fig>i)S.fig--;renderFigs();markFig();}}}}}
function previewCapture(){
  removeTemp();const r=cap.res;const i=registerMove('cap_tmp_'+cap.count+(cap.swap?'s':''),T('capPreviewName'),S.dance,capActors(),r.frames,r.fps,{temp:true});
  renderFigs();selectFig(i);
  document.querySelector('.stage').scrollIntoView({behavior:'smooth',block:'start'});
}
$('capPreview').onclick=previewCapture;
$('capDiscard').onclick=()=>{removeTemp();cap.res=null;capReset();$('capOpts').hidden=false;};
$('capAdd').onclick=()=>{
  if(!cap.res)return;removeTemp();const r=cap.res;const name=($('capName').value||'').trim()||T('capDefaultName',{n:cap.count});
  const id=Date.now()+'-'+Math.random().toString(36).slice(2,6);const key='user_'+id;const actors=capActors();const free=$('capFree').checked;
  const i=registerMove(key,name,S.dance,actors,r.frames,r.fps,{id,free});
  saveMove({id,name,dance:S.dance,fps:r.fps,frames:r.frames,free,actors:actors.map(a=>({role:a.role,f:a.f}))});
  renderFigs();selectFig(i);capErr('');$('capDone').hidden=true;$('capWork').hidden=true;
  $('capSummary').textContent='';$('capStatus').textContent='';$('capFileName').textContent=T('capAdded',{d:DN(DANCES[S.dance])});cap.res=null;
};
function saveMove(rec){try{if(song.db)song.db.transaction('moves','readwrite').objectStore('moves').put(rec);}catch(e){}}
async function loadMoves(){
  if(!song.db)return;try{const all=await new Promise((res,rej)=>{const q=song.db.transaction('moves').objectStore('moves').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
    for(const r of all){if(!DANCES[r.dance])continue;registerMove('user_'+r.id,r.name,r.dance,r.actors.map(a=>({role:a.role,f:new Float32Array(a.f)})),r.frames,r.fps,{id:r.id,free:r.free});}
    if(all.length&&S.dance){renderFigs();markFig();}}catch(e){}
}
$('userFigDel').onclick=()=>{
  const d=DANCES[S.dance];const f=d.figs[S.fig];if(!f||!f.user)return;
  try{if(song.db)song.db.transaction('moves','readwrite').objectStore('moves').delete(f.id);}catch(e){}
  d.figs.splice(S.fig,1);const ti=d.takes.findIndex(t=>t.clip===f.clip);if(ti>=0)d.takes.splice(ti,1);
  delete decoded[f.clip];selectFree();
};

/* ---------- live camera: record video + skeleton, play back, optionally save to server.py ---------- */
const camS={mod:null,live:null,player:null,people:1,list:[],cur:null,server:false};
const camMod=async()=>camS.mod||(camS.mod=await import(new URL('camera.js',document.baseURI).href));
const camErr=m=>{$('camErr').textContent=m||'';};
const fmtS=s=>{s=Math.max(0,s||0);return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;};
const setCamPeople=n=>{camS.people=n;$('camP1').setAttribute('aria-pressed',String(n===1));$('camP2').setAttribute('aria-pressed',String(n===2));};
$('camP1').onclick=()=>setCamPeople(1);$('camP2').onclick=()=>setCamPeople(2);
$('camMirror').onchange=e=>{if(camS.live)camS.live.setMirror(e.target.checked);};
$('camOpen').onclick=async()=>{
  camErr('');if(camS.live?.open)return;
  $('camOpen').disabled=true;$('camStatus').textContent=T('camLoading');
  try{
    const m=await camMod();
    camS.live=new m.LiveCam($('camCanvas'),{onStatus:st=>{
      $('camStatus').innerHTML='';const sp=document.createElement('span');
      if(st.sec!==null){sp.className='cam-rec';sp.textContent=T('camRecording',{s:fmtS(st.sec)});}
      else sp.textContent=T('camStatusLive',{fps:Math.round(st.fps),n:st.people});
      $('camStatus').appendChild(sp);}});
    $('camLive').hidden=false;
    await camS.live.start(camS.people,$('camMirror').checked);
    $('camP1').disabled=$('camP2').disabled=true;
  }catch(err){
    camErr(err.name==='NotAllowedError'||err.name==='NotFoundError'||err.message==='nocam'?T('camNoCam'):T('capFail',{m:err.message||err}));
    if(camS.live)await camS.live.stop();camS.live=null;$('camLive').hidden=true;
  }finally{$('camOpen').disabled=false;}
};
$('camClose').onclick=async()=>{if(camS.live){if(camS.live.recording)await camStopRec();await camS.live.stop();}camS.live=null;$('camLive').hidden=true;
  $('camP1').disabled=$('camP2').disabled=false;$('camRec').textContent=T('camRec');$('camRec').classList.remove('rec');};
async function camStopRec(){
  const rec=await camS.live.stopRec();$('camRec').textContent=T('camRec');$('camRec').classList.remove('rec');
  if(!rec)return;
  const d=new Date(rec.created);rec.name=T('camDefaultName',{d:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`});
  const item={id:'local-'+Date.now(),where:'local',name:rec.name,duration:rec.duration,rec,url:URL.createObjectURL(rec.blob)};
  camS.list.unshift(item);renderRecs();camPlay(item);
}
$('camRec').onclick=async()=>{
  if(!camS.live?.open)return;camErr('');
  if(camS.live.recording){await camStopRec();return;}
  if(!window.MediaRecorder){camErr(T('camNoRec'));return;}
  camS.live.startRec();$('camRec').textContent=T('camRecStop');$('camRec').classList.add('rec');
};
window.renderRecs=renderRecs;
function renderRecs(){
  const box=$('camRecs');box.innerHTML='';
  if(!camS.list.length){const n=document.createElement('div');n.className='note';n.textContent=T('camNone');box.appendChild(n);}
  for(const it of camS.list){
    const b=document.createElement('div');b.className='song';b.setAttribute('role','button');b.tabIndex=0;b.setAttribute('aria-pressed',String(camS.cur===it));
    b.innerHTML=`<span class="nm"></span><span class="where"></span><span class="bpm"></span><button class="x" aria-label="${T('camDel')}">×</button>`;
    b.querySelector('.nm').textContent=it.name;b.querySelector('.where').textContent=it.where==='server'?T('camOnServer'):T('camLocal');
    b.querySelector('.bpm').textContent=fmtS(it.duration);
    b.onclick=async e=>{
      if(e.target.closest('.x')){
        if(!confirm(T('camDelAsk',{name:it.name})))return;
        try{if(it.where==='server')await camS.mod.server.remove(it.id);}catch(err){camErr(T('capFail',{m:err.message}));return;}
        if(camS.cur===it)camHide();if(it.url&&it.where==='local')URL.revokeObjectURL(it.url);
        camS.list=camS.list.filter(x=>x!==it);renderRecs();return;}
      camPlay(it);};
    b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.click();}};
    box.appendChild(b);
  }
  $('camServer').textContent=camS.server?T('camServerOn'):T('camServerOff');
}
async function camPlay(it){
  camErr('');const m=await camMod();
  if(!camS.player)camS.player=new m.Player($('camPlayCanvas'),$('camVideo'));
  try{
    if(!it.rec){const r=await m.server.get(it.id);it.rec=r;it.url=m.server.videoURL(it.id);}
    camS.cur=it;renderRecs();$('camPlay').hidden=false;
    camS.player.showVideo=$('camShowVideo').checked;
    await camS.player.load(it.rec,it.url);
    $('camSave').hidden=!(camS.server&&it.where==='local');$('camSave').disabled=false;
    $('camPlayNote').textContent=T('camPlayInfo',{s:camS.player.duration.toFixed(1),n:it.rec.samples.length});
    camSyncUI();
  }catch(err){camErr(T('camLoadFail',{m:err.message||err}));}
}
function camHide(){if(camS.player)camS.player.unload();camS.cur=null;$('camPlay').hidden=true;renderRecs();}
function camSyncUI(){const v=$('camVideo'),d=camS.player?camS.player.duration:0;
  $('camPP').textContent=v.paused?'▶':'❚❚';$('camPP').setAttribute('aria-label',v.paused?T('play'):T('pause'));
  $('camTime').textContent=`${v.currentTime.toFixed(1)} / ${d.toFixed(1)} s`;if(d&&!camS.seeking)$('camSeek').value=Math.round(v.currentTime/d*1000);}
$('camVideo').ontimeupdate=$('camVideo').onplay=$('camVideo').onpause=$('camVideo').onended=camSyncUI;
$('camPP').onclick=()=>{const v=$('camVideo');if(v.paused){if(v.ended)v.currentTime=0;v.play().catch(()=>{});}else v.pause();};
$('camSeek').oninput=e=>{camS.seeking=true;const d=camS.player?.duration||0;$('camVideo').currentTime=e.target.value/1000*d;camSyncUI();};
$('camSeek').onchange=()=>{camS.seeking=false;};
$('camShowVideo').onchange=e=>{if(camS.player)camS.player.showVideo=e.target.checked;};
$('camHide').onclick=camHide;
$('camToStage').onclick=()=>{
  const it=camS.cur;if(!it)return;camErr('');
  try{cap.res=camS.mod.toMotion(it.rec);}catch(err){camErr(err.message==='nobody'?T('camNoPose'):T('capFail',{m:err.message}));return;}
  removeTemp();capReset();cap.swap=false;cap.count++;$('capFileName').textContent=it.name;showCapDone();
};
$('camSave').onclick=async()=>{
  const it=camS.cur;if(!it||it.where!=='local')return;
  $('camSave').disabled=true;$('camPlayNote').textContent=T('camSaving');
  try{const id=await camS.mod.server.save({...it.rec,name:it.name});
    it.id=id;it.where='server';$('camSave').hidden=true;$('camPlayNote').textContent=T('camSaved');renderRecs();}
  catch(err){$('camSave').disabled=false;$('camPlayNote').textContent=T('camSaveFail',{m:err.message||err});}
};
/* the camera section only needs camera.js once used, but checking for the server is cheap and sets up the list */
(async()=>{try{const m=await camMod();camS.server=await m.server.ping();
  if(camS.server){const L=await m.server.list();for(const r of L)camS.list.push({id:r.id,where:'server',name:r.name,duration:r.duration});}}catch(e){}renderRecs();})();

/* ---------- loop ---------- */
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight,pr=renderer.getPixelRatio();if(canvas.width!==Math.floor(w*pr)||canvas.height!==Math.floor(h*pr)){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}
const clock=new THREE.Clock();const prevTarget=V();
function tick(){
  const dt=Math.min(clock.getDelta(),0.1);
  if(S.playing&&S.clip)advance(dt);
  if(S.clip)music.tick(S.t,effSpeed(),S.playing&&!song.cur);
  song.tickUI();pip.sync();updateFootprints();updateBeats();
  if(S.follow&&S.clip){prevTarget.copy(controls.target);controls.target.lerp(centroid,0.1);camera.position.add(_tmp.subVectors(controls.target,prevTarget));}
  key.target.position.copy(controls.target).setY(0);key.position.set(controls.target.x+2.5,7,controls.target.z+4);
  controls.update();resize();renderer.render(scene,camera);requestAnimationFrame(tick);
}
let start='salsa';try{const s=localStorage.getItem('dance-id');if(s&&DANCES[s])start=s;}catch(e){}
$('langZh').onclick=()=>setLang('zh');$('langEn').onclick=()=>setLang('en');
selectDance(start);applyLang();song.load().then(loadMoves);tick();
</script>
